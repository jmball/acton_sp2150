[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "acton_sp2150"
version = "0.0.2"
description = "Princeton Instruments Acton SP2150 monochromator control library"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "James Ball"}]
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "pyvisa",
  "pyvisa-py[serial]",
]

[project.urls]
Homepage = "https://github.com/jmball/acton_sp2150"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.17.3",
    "ty>=0.0.92",
]

[tool.ty.src]
include = ["src", "examples", "tests"]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
